<!DOCTYPE html> <!--to tell browser what version of html is being used-->
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Autocomplete Search Bar</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/26068c1302.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="search-box">
            <div class="row">
                <input type="text" id="input-box" placeholder="Search" autocomplete="off">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="result-box">
            </div>
        </div>
        <script src="autoComplete.js"></script>
    </body>
</html>
